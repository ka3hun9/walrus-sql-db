name: SQL Compare Nightly

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  sql-compare-nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: SQLite matrix compare (nightly profile)
        run: npm run sql:compare:matrix:nightly

      - name: Upload nightly compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compare-nightly-report
          path: reports/sql-compare-nightly.json
          if-no-files-found: ignore

      - name: Upload nightly MRE files (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compare-nightly-mre
          path: reports/mre
          if-no-files-found: ignore

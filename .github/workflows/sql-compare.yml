name: SQL Compare Matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.cats.outputs.categories }}
    steps:
      - name: Set category matrix
        id: cats
        run: echo 'categories=["compare","null-3vl","like","in-between","subquery","correlated","expr","logic","having","g3b-fixture","g3d-fixture"]' >> $GITHUB_OUTPUT

  sql-compare-by-category:
    runs-on: ubuntu-latest
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJson(needs.prep.outputs.categories) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: SQL matrix compare by category
        run: npm run sql:compare:matrix:category -- ${{ matrix.category }}

      - name: SQL budget gate (PR)
        run: npm run sql:budget:gate -- reports/sql-compare-category.json pr

      - name: Upload category report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compare-${{ matrix.category }}-report
          path: reports/sql-compare-category.json
          if-no-files-found: ignore

      - name: Upload category MRE files (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-compare-${{ matrix.category }}-mre
          path: reports/mre
          if-no-files-found: ignore

  sql-roadmap-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: SQL roadmap smoke
        run: npm run sql:roadmap

      - name: SQL semantic grouped regressions
        run: npm run sql:semantic:grouped

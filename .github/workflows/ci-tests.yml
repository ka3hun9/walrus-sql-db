name: CI Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  full-ci-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:ci:unit

      - name: Integration tests
        run: npm run test:ci:integration

      - name: Regression tests
        run: npm run test:ci:regression

      - name: Benchmark gate
        run: npm run test:ci:benchmark

      - name: Performance benchmark report (artifact)
        run: npm run sql:perf:bench

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-performance-benchmark
          path: reports/sql-performance-benchmark.json
          if-no-files-found: ignore
